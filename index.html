    <!-- IALE theme bootstrap -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("iale_theme");
          if (!t) {
            t =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                ? "overcast"
                : "blueprint";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.style.colorScheme = t === "overcast" ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
